<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 2D SVG 动画</title>
  <style>
    :root {
      --bg-sky-top: #7ec8f8;
      --bg-sky-bottom: #cbe9ff;
      --sun-glow: rgba(255, 245, 180, 0.9);
      --sun-core: #fff9d2;
      --sea-top: #3aa6d0;
      --sea-bottom: #1f6f96;
      --hill-far: #65b89a;
      --hill-near: #439a79;
      --ground-sand: #d8c397;
      --road-color: #3b424f;
      --road-mark: #f3f5f8;
      --accent-bike: #e65134;
      --accent-bike-dark: #b8361e;
      --accent-bike-light: #ff785e;
      --pouch-color: #ff9d6c;
      --pouch-shadow: #ea7944;
      --ui-bg: rgba(255, 255, 255, 0.85);
      --ui-text: #2c3e50;
      --ui-border: rgba(255, 255, 255, 0.4);
      --ui-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
      --headlight-beam: rgba(255, 255, 220, 0);
    }

    [data-theme="sunset"] {
      --bg-sky-top: #4a2574;
      --bg-sky-bottom: #f38166;
      --sun-glow: rgba(255, 140, 80, 0.8);
      --sun-core: #ffe082;
      --sea-top: #6b3064;
      --sea-bottom: #391c49;
      --hill-far: #754457;
      --hill-near: #522a40;
      --ground-sand: #96605a;
      --road-color: #272838;
      --road-mark: #fcd5ce;
      --ui-bg: rgba(39, 40, 56, 0.85);
      --ui-text: #fcd5ce;
      --ui-border: rgba(255, 255, 255, 0.15);
      --ui-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --headlight-beam: rgba(255, 240, 180, 0.25);
    }

    [data-theme="night"] {
      --bg-sky-top: #0b132b;
      --bg-sky-bottom: #1c2541;
      --sun-glow: rgba(200, 220, 255, 0.3);
      --sun-core: #e0e6ed;
      --sea-top: #132238;
      --sea-bottom: #09131e;
      --hill-far: #1c3144;
      --hill-near: #10212f;
      --ground-sand: #2a3439;
      --road-color: #171a21;
      --road-mark: #8d99ae;
      --ui-bg: rgba(19, 34, 56, 0.85);
      --ui-text: #e0e6ed;
      --ui-border: rgba(255, 255, 255, 0.1);
      --ui-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      --headlight-beam: rgba(255, 250, 200, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stage-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1400px;
      max-height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(to bottom, var(--bg-sky-top), var(--bg-sky-bottom) 65%);
      transition: background 0.8s ease;
    }

    /* Floating Controller Bar */
    .controls {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--ui-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--ui-border);
      box-shadow: var(--ui-shadow);
      z-index: 100;
      transition: all 0.4s ease;
    }

    .btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ui-text);
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(128, 128, 128, 0.15);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.active {
      background: var(--accent-bike);
      color: #fff;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--ui-border);
    }

    /* Speed Slider */
    .speed-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ui-text);
      font-size: 13px;
    }

    input[type="range"] {
      width: 85px;
      height: 4px;
      accent-color: var(--accent-bike);
      cursor: pointer;
    }

    /* Bell Wave Effect */
    @keyframes bellRings {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .bell-wave {
      transform-origin: 605px 230px;
      animation: bellRings 0.6s ease-out forwards;
      pointer-events: none;
    }

    /* Scenery scrolling */
    .scroll-fast {
      will-change: transform;
    }

    /* Sun & Stars */
    .celestial {
      transition: all 0.8s ease;
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <!-- Controls Overlay -->
    <div class="controls">
      <button class="btn" id="btn-bell" title="按响车铃">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
        </svg>
        <span>按铃</span>
      </button>

      <div class="divider"></div>

      <div class="speed-wrapper">
        <span>速度</span>
        <input type="range" id="speed-slider" min="0.3" max="2.4" step="0.1" value="1.0">
      </div>

      <div class="divider"></div>

      <button class="btn" id="btn-theme" title="切换时段">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span id="theme-label">海边</span>
      </button>

      <div class="divider"></div>

      <button class="btn" id="btn-sound" title="音效开关">
        <svg id="sound-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span id="sound-label">声音</span>
      </button>

      <button class="btn" id="btn-pause" title="暂停/继续">
        <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
    </div>

    <!-- Main SVG Scene -->
    <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Shadow filters -->
        <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
          <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.25"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Gradients -->
        <radialGradient id="sun-gradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--sun-core)" />
          <stop offset="60%" stop-color="var(--sun-glow)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </radialGradient>

        <linearGradient id="sea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--sea-top)" />
          <stop offset="100%" stop-color="var(--sea-bottom)" />
        </linearGradient>

        <linearGradient id="pouch-grad" x1="20%" y1="10%" x2="80%" y2="90%">
          <stop offset="0%" stop-color="#ffb17a" />
          <stop offset="60%" stop-color="var(--pouch-color)" />
          <stop offset="100%" stop-color="var(--pouch-shadow)" />
        </linearGradient>

        <linearGradient id="beak-grad" x1="0%" y1="0%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#f59e0b" />
          <stop offset="70%" stop-color="#fbbf24" />
          <stop offset="100%" stop-color="#d97706" />
        </linearGradient>

        <linearGradient id="body-grad" x1="30%" y1="10%" x2="70%" y2="90%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <linearGradient id="wing-grad" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#e2e8f0" />
          <stop offset="90%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#475569" />
        </linearGradient>

        <linearGradient id="bike-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--accent-bike-light)" />
          <stop offset="50%" stop-color="var(--accent-bike)" />
          <stop offset="100%" stop-color="var(--accent-bike-dark)" />
        </linearGradient>

        <linearGradient id="tire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2a2e39" />
          <stop offset="100%" stop-color="#181b22" />
        </linearGradient>

        <linearGradient id="rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e2e8f0" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <!-- Headlight Beam Gradient -->
        <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="40%">
          <stop offset="0%" stop-color="var(--headlight-beam)" />
          <stop offset="40%" stop-color="var(--headlight-beam)" />
          <stop offset="100%" stop-color="rgba(255,255,200,0)" />
        </linearGradient>
      </defs>

      <!-- 1. Sky & Celestial Body (Sun/Moon) -->
      <g id="sky-group">
        <!-- Celestial Body -->
        <circle id="celestial" class="celestial" cx="1020" cy="140" r="65" fill="url(#sun-gradient)" />
        
        <!-- Distant Clouds (Parallax 1) -->
        <g id="clouds-layer" opacity="0.85">
          <!-- Dynamically populated / animated -->
        </g>
      </g>

      <!-- 2. Ocean & Far Hills -->
      <g id="background-hills">
        <!-- Sea Horizon -->
        <rect x="0" y="320" width="1200" height="90" fill="url(#sea-grad)" />
        <path id="sea-sparkles" d="" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />

        <!-- Sailboat in distance -->
        <g id="distant-boat" transform="translate(850, 325)">
          <path d="M0,8 L18,8 L14,14 L3,14 Z" fill="#ffffff" />
          <path d="M10,8 L10,1 L17,8 Z" fill="#f87171" />
        </g>

        <!-- Far Islands / Coastal Hills -->
        <g id="hills-layer">
          <!-- Seamless hills generated by JS -->
        </g>
      </g>

      <!-- 3. Coastal Promenade / Fences & Palms (Parallax 2) -->
      <g id="midground-layer">
        <!-- Promanade Wall & Railing -->
        <rect x="0" y="410" width="1200" height="25" fill="var(--ground-sand)" />
        <g id="railing-layer"></g>
      </g>

      <!-- 4. Road & Street Details -->
      <g id="road-group">
        <!-- Main Asphalt Road -->
        <rect x="0" y="435" width="1200" height="190" fill="var(--road-color)" />
        <!-- Top Curb / Gutter -->
        <rect x="0" y="435" width="1200" height="7" fill="#20242c" />
        <line x1="0" y1="442" x2="1200" y2="442" stroke="#e2e8f0" stroke-width="3" opacity="0.6" />
        <!-- Bottom Curb line -->
        <line x1="0" y1="590" x2="1200" y2="590" stroke="#e2e8f0" stroke-width="4" opacity="0.4" />
        <!-- Dashed White Center Line (fast scroll) -->
        <g id="road-lines"></g>
      </g>

      <!-- 5. Dust and Tire Specks -->
      <g id="dust-particles"></g>

      <!-- 6. Ground Shadows -->
      <g id="shadows-layer">
        <!-- Bike shadow ellipse (scales/deforms with pedal motion) -->
        <ellipse id="bike-shadow" cx="500" cy="565" rx="230" ry="16" fill="rgba(10, 15, 25, 0.45)" />
      </g>

      <!-- 7. Bicycle & Pelican Actor -->
      <g id="actor-group" transform="translate(0, 0)">
        
        <!-- HEADLIGHT CONE OF LIGHT (for night/sunset) -->
        <polygon id="headlight-cone" points="675,372 1200,430 1200,620 675,382" fill="url(#beam-grad)" pointer-events="none" />

        <!-- === FAR SIDE (LEFT SIDE) LEG & PEDAL (Behind bicycle frame) === -->
        <g id="far-leg-group">
          <!-- Far crank arm -->
          <line id="far-crank" x1="490" y1="465" x2="470" y2="440" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
          <!-- Far pedal -->
          <rect id="far-pedal" x="455" y="435" width="26" height="8" rx="3" fill="#334155" />
          <!-- Far Leg (Thigh, Knee, Shin, Webbed Foot) -->
          <path id="far-leg" d="" fill="none" stroke="#d97706" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
          <path id="far-foot" d="" fill="#d97706" />
        </g>

        <!-- === BICYCLE REAR WHEEL === -->
        <g id="rear-wheel" transform="translate(350, 465)">
          <!-- Tire -->
          <circle cx="0" cy="0" r="72" fill="none" stroke="url(#tire-grad)" stroke-width="16" />
          <circle cx="0" cy="0" r="64" fill="none" stroke="#e2e8f0" stroke-width="3" />
          <!-- Spokes container -->
          <g id="rear-spokes"></g>
          <!-- Wheel Hub -->
          <circle cx="0" cy="0" r="13" fill="url(#rim-grad)" stroke="#475569" stroke-width="2" />
          <circle cx="0" cy="0" r="5" fill="#1e293b" />
          <!-- Reflector -->
          <rect x="25" y="-6" width="14" height="12" rx="3" fill="#f59e0b" opacity="0.85" />
        </g>

        <!-- === BICYCLE FRONT WHEEL === -->
        <g id="front-wheel" transform="translate(670, 465)">
          <!-- Tire -->
          <circle cx="0" cy="0" r="72" fill="none" stroke="url(#tire-grad)" stroke-width="16" />
          <circle cx="0" cy="0" r="64" fill="none" stroke="#e2e8f0" stroke-width="3" />
          <!-- Spokes container -->
          <g id="front-spokes"></g>
          <!-- Wheel Hub -->
          <circle cx="0" cy="0" r="13" fill="url(#rim-grad)" stroke="#475569" stroke-width="2" />
          <circle cx="0" cy="0" r="5" fill="#1e293b" />
          <!-- Reflector -->
          <rect x="-38" y="-6" width="14" height="12" rx="3" fill="#f59e0b" opacity="0.85" />
        </g>

        <!-- === BICYCLE FRAME & DRIVE TRAIN === -->
        <g id="bike-frame">
          <!-- Rear Fender (Mudguard) -->
          <path d="M280,455 A78,78 0 0,1 420,420" fill="none" stroke="url(#rim-grad)" stroke-width="6" stroke-linecap="round" />
          <line x1="350" y1="465" x2="305" y2="435" stroke="#94a3b8" stroke-width="2.5" />
          
          <!-- Front Fender (Mudguard) -->
          <path d="M620,420 A78,78 0 0,1 735,470" fill="none" stroke="url(#rim-grad)" stroke-width="6" stroke-linecap="round" />
          <line x1="670" y1="465" x2="715" y2="445" stroke="#94a3b8" stroke-width="2.5" />

          <!-- Chain & Chainring -->
          <!-- Rear Cog -->
          <circle cx="350" cy="465" r="14" fill="#64748b" stroke="#334155" stroke-width="2" />
          <!-- Chain loop -->
          <path d="M350,453 L490,451 A22,22 0 0,1 490,479 L350,477 A14,14 0 0,1 350,453 Z" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="6,3" />
          <!-- Front Chainring (Large cog) -->
          <circle cx="490" cy="465" r="23" fill="url(#rim-grad)" stroke="#334155" stroke-width="3" />
          <circle cx="490" cy="465" r="16" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="5,4" />

          <!-- Frame Tubes (Classic Retro Cruiser Curved Frame) -->
          <!-- Chainstay: Rear Hub (350,465) -> Crank (490,465) -->
          <line x1="350" y1="465" x2="490" y2="465" stroke="url(#bike-frame-grad)" stroke-width="10" stroke-linecap="round" />
          <!-- Seatstay: Rear Hub (350,465) -> Seat cluster (445,345) -->
          <line x1="350" y1="465" x2="445" y2="345" stroke="url(#bike-frame-grad)" stroke-width="9" stroke-linecap="round" />
          <!-- Seat Tube: Crank (490,465) -> Seat cluster (445,345) -->
          <line x1="490" y1="465" x2="445" y2="345" stroke="url(#bike-frame-grad)" stroke-width="11" stroke-linecap="round" />
          <!-- Down Tube: Crank (490,465) -> Head Tube bottom (615,355) -->
          <line x1="490" y1="465" x2="615" y2="355" stroke="url(#bike-frame-grad)" stroke-width="12" stroke-linecap="round" />
          <!-- Top Tube (Swept Cruiser Curve): Seat cluster (445,345) -> Head Tube top (610,310) -->
          <path d="M445,345 Q530,375 610,310" fill="none" stroke="url(#bike-frame-grad)" stroke-width="11" stroke-linecap="round" />
          <!-- Secondary twin tube curve for vintage aesthetics -->
          <path d="M445,365 Q530,395 615,340" fill="none" stroke="url(#bike-frame-grad)" stroke-width="6" stroke-linecap="round" />
          <!-- Head Tube: (610,310) -> (618,365) -->
          <line x1="608" y1="300" x2="620" y2="370" stroke="url(#bike-frame-grad)" stroke-width="14" stroke-linecap="round" />
          <!-- Front Fork: Head tube bottom (620,370) -> Front Hub (670,465) -->
          <line x1="620" y1="370" x2="670" y2="465" stroke="url(#rim-grad)" stroke-width="9" stroke-linecap="round" />

          <!-- Seatpost & Saddle -->
          <line x1="445" y1="345" x2="440" y2="305" stroke="url(#rim-grad)" stroke-width="8" stroke-linecap="round" />
          <!-- Saddle Springs -->
          <path d="M428,308 Q434,316 440,308 Q446,316 452,308" fill="none" stroke="#475569" stroke-width="3" />
          <!-- Retro Leather Saddle -->
          <path d="M410,304 C410,296 425,294 450,296 C470,298 478,304 476,308 C465,310 440,308 410,304 Z" fill="#6d4c41" stroke="#3e2723" stroke-width="2" />

          <!-- Handlebars & Stem -->
          <!-- Stem up from head tube -->
          <line x1="608" y1="300" x2="600" y2="250" stroke="url(#rim-grad)" stroke-width="8" stroke-linecap="round" />
          <!-- Swept Cruiser Handlebars -->
          <path d="M600,250 C590,240 575,235 560,250" fill="none" stroke="url(#rim-grad)" stroke-width="8" stroke-linecap="round" />
          <!-- Handlebar Rubber Grip -->
          <rect x="548" y="246" width="18" height="9" rx="3" fill="#2d3748" transform="rotate(15 557 250)" />

          <!-- Vintage Brass Bell -->
          <g id="bike-bell" transform="translate(595, 235)">
            <ellipse cx="0" cy="0" rx="9" ry="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
            <circle cx="2" cy="-2" r="2.5" fill="#fef08a" />
            <circle cx="-6" cy="4" r="2.5" fill="#92400e" />
          </g>
          <!-- Bell Sound Waves (Triggered on click) -->
          <g id="bell-waves"></g>

          <!-- Vintage Headlight -->
          <g id="bike-headlight" transform="translate(635, 345)">
            <path d="M0,0 L20,-5 L20,15 L0,10 Z" fill="#94a3b8" stroke="#475569" stroke-width="2" />
            <ellipse cx="20" cy="5" rx="4" ry="10" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />
            <circle cx="21" cy="5" r="3" fill="#ffffff" />
          </g>

          <!-- Front Wicker Basket -->
          <g id="front-basket" transform="translate(628, 255)">
            <!-- Basket body -->
            <path d="M0,0 L42,4 L36,44 L-4,40 Z" fill="#b45309" stroke="#78350f" stroke-width="2" />
            <!-- Woven texture lines -->
            <path d="M5,2 L1,41 M15,3 L11,42 M25,4 L21,43 M35,4 L31,44" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
            <path d="M-2,10 L41,14 M-3,20 L39,24 M-4,30 L38,34" stroke="#78350f" stroke-width="1.5" />
            <!-- Basket Rim -->
            <path d="M-3,0 L44,4" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />

            <!-- A little companion fish peeking out of the basket! -->
            <g id="basket-fish" transform="translate(18, 5)">
              <!-- Fish Body -->
              <ellipse cx="0" cy="0" rx="14" ry="9" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
              <!-- Fish Belly -->
              <path d="M-10,3 Q0,10 10,3 Z" fill="#e0f2fe" />
              <!-- Fish Tail -->
              <path id="fish-tail" d="M-14,0 L-22,-7 L-19,0 L-22,7 Z" fill="#0284c7" />

                <!-- Pouch texture / subtle elastic stretch striations -->

              <!-- Wing feather layers -->
              <path d="M475,225 C510,225 545,248 558,246 C535,270 495,275 460,255 Z" fill="#94a3b8" opacity="0.5" />
              <!-- Feathers draped over the handlebar grip like a hand -->
              <path d="M545,238 C558,240 568,244 564,252 C556,256 548,252 542,246 Z" fill="#475569" />
              <path d="M540,242 C552,246 562,250 558,256 C550,258 542,254 536,248 Z" fill="#334155" />

        <!-- === NEAR SIDE (RIGHT SIDE) LEG & PEDAL (In front of bike frame) === -->
        <g id="near-leg-group">
          <!-- Front Chainring Center Nut -->
          <circle cx="490" cy="465" r="7" fill="#334155" stroke="#94a3b8" stroke-width="2" />
          <!-- Near crank arm -->
          <line id="near-crank" x1="490" y1="465" x2="510" y2="490" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>
          <circle id="near-pedal-spindle" cx="510" cy="490" r="4" fill="#475569" />
          <!-- Near pedal platform -->
          <rect id="near-pedal" x="496" y="486" width="28" height="8" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
          <!-- Near Leg (Thigh, Knee, Shin, Webbed Foot) -->
          <path id="near-leg" d="" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Webbed Foot resting on pedal -->
          <path id="near-foot" d="" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
        </g>

        <!-- Speed wind breeze streaks -->
        <g id="breeze-lines" opacity="0.6"></g>

  </div>

  <script>
    // --- 2D PELICAN ON BICYCLE ANIMATION ENGINE ---

    // 1. Scene Elements & Setup
    const scene = document.getElementById('scene');
    const roadLinesGroup = document.getElementById('road-lines');
    const cloudsLayer = document.getElementById('clouds-layer');
    const hillsLayer = document.getElementById('hills-layer');
    const railingLayer = document.getElementById('railing-layer');
    const rearSpokes = document.getElementById('rear-spokes');
    const frontSpokes = document.getElementById('front-spokes');
    const dustGroup = document.getElementById('dust-particles');
    const breezeGroup = document.getElementById('breeze-lines');
    const bellWaves = document.getElementById('bell-waves');

    // Actor Elements
    const actorGroup = document.getElementById('actor-group');
    const pelicanBodyAnchor = document.getElementById('pelican-body-anchor');
    const pelicanNeck = document.getElementById('pelican-neck');
    const throatPouch = document.getElementById('throat-pouch');
    const pouchLines = document.getElementById('pouch-lines');
    const scarfRibbon1 = document.getElementById('scarf-ribbon-1');
    const scarfRibbon2 = document.getElementById('scarf-ribbon-2');
    const featherCrest = document.getElementById('feather-crest');
    const fishTail = document.getElementById('fish-tail');
    const bikeShadow = document.getElementById('bike-shadow');

    // Leg & Crank Elements
    const nearCrank = document.getElementById('near-crank');
    const nearPedal = document.getElementById('near-pedal');
    const nearPedalSpindle = document.getElementById('near-pedal-spindle');
    const nearLeg = document.getElementById('near-leg');
    const nearFoot = document.getElementById('near-foot');

    const farCrank = document.getElementById('far-crank');
    const farPedal = document.getElementById('far-pedal');
    const farLeg = document.getElementById('far-leg');
    const farFoot = document.getElementById('far-foot');

    // Controls Elements
    const btnBell = document.getElementById('btn-bell');
    const speedSlider = document.getElementById('speed-slider');
    const btnTheme = document.getElementById('btn-theme');
    const themeLabel = document.getElementById('theme-label');
    const btnSound = document.getElementById('btn-sound');
    const soundLabel = document.getElementById('sound-label');
    const btnPause = document.getElementById('btn-pause');

    // 2. Build Static / Repeat Geometry

    // Generate Spokes
    function generateSpokes(container, count = 16, radius = 62) {
      let markup = '';
      for (let i = 0; i < count; i++) {
        const angle = (i * 360 / count) * Math.PI / 180;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        markup += `<line x1="0" y1="0" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#cbd5e1" stroke-width="1.2" opacity="0.8" />`;
      }
      container.innerHTML = markup;
    }
    generateSpokes(rearSpokes);
    generateSpokes(frontSpokes);

    // Populate Clouds
    const clouds = [
      { x: 100, y: 70, scale: 0.8, speed: 0.2 },
      { x: 450, y: 110, scale: 1.1, speed: 0.28 },
      { x: 800, y: 55, scale: 0.65, speed: 0.18 },
      { x: 1100, y: 90, scale: 0.95, speed: 0.24 }
    ];

    function renderClouds() {
      let markup = '';
      clouds.forEach((c, idx) => {
        markup += `<g id="cloud-${idx}" transform="translate(${c.x}, ${c.y}) scale(${c.scale})">
          <path d="M0,25 Q15,0 45,10 Q70,-15 105,5 Q135,-5 155,20 Q175,25 170,45 Q165,65 140,65 L20,65 Q-10,65 0,25 Z" fill="#ffffff" opacity="0.85" />
        </g>`;
      });
      cloudsLayer.innerHTML = markup;
    }
    renderClouds();

    // Populate Road Dashes
    const roadDashCount = 14;
    const roadDashSpacing = 1200 / (roadDashCount - 2);
    let roadDashes = [];
    for (let i = 0; i < roadDashCount; i++) {
      roadDashes.push({ x: i * roadDashSpacing });
    }

    // Populate Fence Railing
    const postCount = 18;
    const postSpacing = 1200 / (postCount - 2);
    let posts = [];
    for (let i = 0; i < postCount; i++) {
      posts.push({ x: i * postSpacing });
    }

    // 3. Mathematical Inverse Kinematics for Pedaling Legs
    // Crank Center: (490, 465)
    // Crank Radius: 32px
    // Hip Position: near (458, 282), far (452, 276)
    // Upper Leg (Thigh): L1 = 92px
    // Lower Leg (Shin/Tarsus): L2 = 98px
    const CRANK_CENTER_X = 490;
    const CRANK_CENTER_Y = 465;
    const CRANK_R = 33;
    const L1 = 90;
    const L2 = 96;

    function solveLegIK(hipX, hipY, footX, footY, isNear = true) {
      const dx = footX - hipX;
      const dy = footY - hipY;
      const dist = Math.hypot(dx, dy);
      const clampedDist = Math.min(dist, L1 + L2 - 0.5);

      const baseAngle = Math.atan2(dy, dx);
      const cosA = (L1 * L1 + clampedDist * clampedDist - L2 * L2) / (2 * L1 * clampedDist);
      const angleA = Math.acos(Math.max(-1, Math.min(1, cosA)));

      // Knee bends forward (to the right, so subtract angle)
      const kneeAngle = baseAngle - angleA;
      const kneeX = hipX + L1 * Math.cos(kneeAngle);
      const kneeY = hipY + L1 * Math.sin(kneeAngle);

      return { kneeX, kneeY };
    }

    // Webbed Foot Path Generator
    function makeFootPath(ankleX, ankleY, angleRad) {
      const cos = Math.cos(angleRad);
      const sin = Math.sin(angleRad);
      // Local offsets for a cute webbed bird foot
      const p = [
        { x: -8, y: -2 },
        { x: 18, y: -4 },
        { x: 26, y: 1 },
        { x: 24, y: 7 },
        { x: 14, y: 6 },
        { x: -6, y: 4 }
      ];
      const trans = p.map(pt => {
        const rx = pt.x * cos - pt.y * sin + ankleX;
        const ry = pt.x * sin + pt.y * cos + ankleY;
        return `${rx.toFixed(1)},${ry.toFixed(1)}`;
      });
      return `M${trans[0]} L${trans[1]} L${trans[2]} L${trans[3]} L${trans[4]} L${trans[5]} Z`;
    }

    // 4. Animation State & Web Audio Sound Synth
    let isRunning = true;
    let speedMult = 1.0;
    let currentTheme = 'day'; // day, sunset, night
    let soundEnabled = true;

    let crankAngle = 0;
    let wheelAngle = 0;
    let roadOffset = 0;
    let fenceOffset = 0;
    let lastTime = performance.now();

    // Audio Context (Synthesized procedural sound effects)
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Realistic Bicycle Bell Synthesizer (Double Ping "Ding-Ding!")
    function playBicycleBell() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      [0, 0.12].forEach((delay, idx) => {
        const t = now + delay;
        // Two tuned ringing harmonics for bell metallic brightness
        const freqs = [2120 + idx * 80, 2750 + idx * 60];
        freqs.forEach((freq, fIdx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = fIdx === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.35 / (fIdx + 1), t + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.6);
        });
      });
    }

    // Soft Bicycle Freewheel / Chain Ticking Sound
    let lastTickTime = 0;
    function playChainTick() {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      if (now - lastTickTime < 0.08 / speedMult) return;
      lastTickTime = now;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'highpass';
      osc.frequency.setValueAtTime(1400 + Math.random() * 400, now);

      gain.gain.setValueAtTime(0.02, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.03);
    }

    // Bell Visual Effect
    function triggerBellVisual() {
      playBicycleBell();

      // Ripple rings
      const ring1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      ring1.setAttribute('cx', '595');
      ring1.setAttribute('cy', '235');
      ring1.setAttribute('r', '14');
      ring1.setAttribute('fill', 'none');
      ring1.setAttribute('stroke', '#fbbf24');
      ring1.setAttribute('stroke-width', '2.5');
      ring1.setAttribute('class', 'bell-wave');

      bellWaves.appendChild(ring1);
      setTimeout(() => ring1.remove(), 600);

      // Pelican happy blink & fish excited flap
      const pupil = document.getElementById('pelican-pupil');
      pupil.setAttribute('transform', 'scale(1, 0.2) translate(0, 8)');
      setTimeout(() => pupil.removeAttribute('transform'), 350);
    }

    // Dust & Speed streaks generator
    let dustParticles = [];
    let breezeStreaks = [];

    function spawnDust() {
      if (dustParticles.length < 15 && Math.random() < 0.35 * speedMult) {
        dustParticles.push({
          x: 345 + (Math.random() - 0.5) * 15,
          y: 535 + Math.random() * 6,
          radius: 3 + Math.random() * 4,
          opacity: 0.7,
          vx: -(2.5 + Math.random() * 3) * speedMult,
          vy: -(0.4 + Math.random() * 0.8)
        });
      }
    }

    function spawnBreeze() {
      if (breezeStreaks.length < 5 && Math.random() < 0.08 * speedMult) {
        breezeStreaks.push({
          x: 1220,
          y: 200 + Math.random() * 320,
          len: 40 + Math.random() * 60,
          speed: (12 + Math.random() * 8) * speedMult,
          opacity: 0.5
        });
      }
    }

    // 5. Main Animation Loop (60+ FPS RequestAnimationFrame)
    function animate(currentTime) {
      if (!isRunning) {
        requestAnimationFrame(animate);
        return;
      }

      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      const cadence = 3.6 * speedMult; // crank rad/s
      crankAngle = (crankAngle + cadence * dt) % (Math.PI * 2);

      // Wheel rotation (proportional to forward speed)
      const wheelRotationSpeed = (cadence * 1.5 * 180 / Math.PI) * dt;
      wheelAngle = (wheelAngle + wheelRotationSpeed) % 360;
      rearSpokes.setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);
      frontSpokes.setAttribute('transform', `rotate(${wheelAngle.toFixed(1)})`);

      // Chain tick audio
      if (soundEnabled) playChainTick();

      // Background Parallax Scrolling
      // Clouds
      clouds.forEach((c, idx) => {
        c.x -= c.speed * speedMult * 60 * dt;
        if (c.x < -200) c.x = 1250;
        const el = document.getElementById(`cloud-${idx}`);
        if (el) el.setAttribute('transform', `translate(${c.x.toFixed(1)}, ${c.y}) scale(${c.scale})`);
      });

      // Fence Posts (Midground)
      fenceOffset = (fenceOffset + 240 * speedMult * dt) % postSpacing;
      let railingMarkup = '';
      for (let i = -1; i < postCount + 1; i++) {
        const px = i * postSpacing - fenceOffset;
        railingMarkup += `<rect x="${px.toFixed(1)}" y="402" width="6" height="33" rx="2" fill="#cbd5e1" />`;
      }
      railingMarkup += `<line x1="0" y1="412" x2="1200" y2="412" stroke="#e2e8f0" stroke-width="3" />`;
      railingLayer.innerHTML = railingMarkup;

      // Road Dashes (Foreground Fast)
      roadOffset = (roadOffset + 480 * speedMult * dt) % roadDashSpacing;
      let roadMarkup = '';
      for (let i = -1; i < roadDashCount + 1; i++) {
        const rx = i * roadDashSpacing - roadOffset;
        roadMarkup += `<line x1="${rx.toFixed(1)}" y1="510" x2="${(rx + 45).toFixed(1)}" y2="510" stroke="var(--road-mark)" stroke-width="6" stroke-linecap="round" />`;
      }
      roadLinesGroup.innerHTML = roadMarkup;

      // Dynamic Pelican & Bike Bobbing
      // Pelican bobs with each foot stroke (2 cycles per crank rev)
      const bobY = Math.sin(crankAngle * 2) * (3.5 * Math.min(speedMult, 1.5));
      const rockRot = Math.cos(crankAngle) * (1.8 * Math.min(speedMult, 1.5)); // slight weight shift
      pelicanBodyAnchor.setAttribute('transform', `translate(0, ${bobY.toFixed(2)}) rotate(${rockRot.toFixed(2)} 460 280)`);

      // Bike shadow breathing
      const shadowScaleX = 1 + Math.sin(crankAngle * 2) * 0.03;
      bikeShadow.setAttribute('transform', `translate(500, 565) scale(${shadowScaleX.toFixed(3)}, 1) translate(-500, -565)`);

      // Pelican Throat Pouch Elastic Jiggle
      // Secondary spring motion trailing the pedaling rhythm
      const pouchLag = crankAngle * 2 - 0.7;
      const pouchDip = 75 + Math.sin(pouchLag) * 9 * Math.min(speedMult, 1.6);
      const pouchTipX = 60 + Math.cos(pouchLag) * 4;
      throatPouch.setAttribute('d', `M8,10 Q${pouchTipX.toFixed(1)},${pouchDip.toFixed(1)} 118,8 Q50,25 8,10 Z`);
      pouchLines.setAttribute('d', `M25,18 Q${(pouchTipX - 5).toFixed(1)},${(pouchDip - 20).toFixed(1)} 85,14 M35,22 Q${pouchTipX.toFixed(1)},${(pouchDip - 17).toFixed(1)} 95,12 M45,26 Q${(pouchTipX + 10).toFixed(1)},${(pouchDip - 19).toFixed(1)} 105,10`);

      // Scarf Flutter (Wind wave physics)
      const wavePhase = currentTime * 0.015 * speedMult;
      const s1Y = -5 + Math.sin(wavePhase) * 7;
      const s2Y = 18 + Math.cos(wavePhase * 1.3) * 6;
      scarfRibbon1.setAttribute('d', `M-6,0 Q-25,${(-12 + Math.sin(wavePhase) * 4).toFixed(1)} -50,${s1Y.toFixed(1)} Q-25,-8 -4,5 Z`);
      scarfRibbon2.setAttribute('d', `M-5,4 Q-22,${(12 + Math.cos(wavePhase) * 4).toFixed(1)} -45,${s2Y.toFixed(1)} Q-25,8 -2,6 Z`);

      // Feather Crest Breeze
      const crestWave = Math.sin(wavePhase * 0.8) * 3;
      featherCrest.setAttribute('transform', `rotate(${crestWave.toFixed(1)} -15 -6)`);

      // Little Fish Companion Flapping
      const fishTailAngle = Math.sin(currentTime * 0.02 * speedMult) * 22;
      fishTail.setAttribute('transform', `rotate(${fishTailAngle.toFixed(1)} -14 0)`);

      // INVERSE KINEMATICS: PEDALS & LEGS
      // 1. Near Side (Right Leg)
      const nearAngle = crankAngle;
      const nearFootX = CRANK_CENTER_X + Math.cos(nearAngle) * CRANK_R;
      const nearFootY = CRANK_CENTER_Y + Math.sin(nearAngle) * CRANK_R;
      nearCrank.setAttribute('x2', nearFootX.toFixed(1));
      nearCrank.setAttribute('y2', nearFootY.toFixed(1));
      nearPedalSpindle.setAttribute('cx', nearFootX.toFixed(1));
      nearPedalSpindle.setAttribute('cy', nearFootY.toFixed(1));
      nearPedal.setAttribute('x', (nearFootX - 14).toFixed(1));
      nearPedal.setAttribute('y', (nearFootY - 4).toFixed(1));

      // Near Hip follows body bobbing
      const nearHipX = 458;
      const nearHipY = 282 + bobY;
      const nearIK = solveLegIK(nearHipX, nearHipY, nearFootX, nearFootY, true);
      nearLeg.setAttribute('d', `M${nearHipX},${nearHipY.toFixed(1)} Q${nearIK.kneeX.toFixed(1)},${nearIK.kneeY.toFixed(1)} ${nearFootX.toFixed(1)},${nearFootY.toFixed(1)}`);
      
      // Near foot tilt
      const footTilt = Math.sin(nearAngle) * 0.15;
      nearFoot.setAttribute('d', makeFootPath(nearFootX, nearFootY, footTilt));

      // 2. Far Side (Left Leg, 180 deg out of phase)
      const farAngle = crankAngle + Math.PI;
      const farFootX = CRANK_CENTER_X + Math.cos(farAngle) * CRANK_R;
      const farFootY = CRANK_CENTER_Y + Math.sin(farAngle) * CRANK_R;
      farCrank.setAttribute('x2', farFootX.toFixed(1));
      farCrank.setAttribute('y2', farFootY.toFixed(1));
      farPedal.setAttribute('x', (farFootX - 13).toFixed(1));
      farPedal.setAttribute('y', (farFootY - 4).toFixed(1));

      const farHipX = 452;
      const farHipY = 276 + bobY;
      const farIK = solveLegIK(farHipX, farHipY, farFootX, farFootY, false);
      farLeg.setAttribute('d', `M${farHipX},${farHipY.toFixed(1)} Q${farIK.kneeX.toFixed(1)},${farIK.kneeY.toFixed(1)} ${farFootX.toFixed(1)},${farFootY.toFixed(1)}`);
      farFoot.setAttribute('d', makeFootPath(farFootX, farFootY, Math.sin(farAngle) * 0.15));

      // Particles Update (Dust)
      spawnDust();
      let dustMarkup = '';
      for (let i = dustParticles.length - 1; i >= 0; i--) {
        const p = dustParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.radius += 0.12;
        p.opacity -= 0.016;
        if (p.opacity <= 0) {
          dustParticles.splice(i, 1);
        } else {
          dustMarkup += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.radius.toFixed(1)}" fill="#cbd5e1" opacity="${p.opacity.toFixed(2)}" />`;
        }
      }
      dustGroup.innerHTML = dustMarkup;

      // Breeze Streaks Update
      spawnBreeze();
      let breezeMarkup = '';
      for (let i = breezeStreaks.length - 1; i >= 0; i--) {
        const b = breezeStreaks[i];
        b.x -= b.speed;
        if (b.x < -100) {
          breezeStreaks.splice(i, 1);
        } else {
          breezeMarkup += `<line x1="${b.x.toFixed(1)}" y1="${b.y.toFixed(1)}" x2="${(b.x + b.len).toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="${b.opacity}" />`;
        }
      }
      breezeGroup.innerHTML = breezeMarkup;

      requestAnimationFrame(animate);
    }

    // 6. User Interaction & Event Listeners
    // Bell click
    btnBell.addEventListener('click', () => {
      triggerBellVisual();
    });

    // Also clicking directly on the bicycle bell triggers it
    document.getElementById('bike-bell').style.cursor = 'pointer';
    document.getElementById('bike-bell').addEventListener('click', () => {
      triggerBellVisual();
    });

    // Also clicking the basket tickles the fish
    document.getElementById('front-basket').style.cursor = 'pointer';
    document.getElementById('front-basket').addEventListener('click', () => {
      triggerBellVisual();
    });

    // Speed Slider
    speedSlider.addEventListener('input', (e) => {
      speedMult = parseFloat(e.target.value);
    });

    // Theme Switcher (Day -> Sunset -> Night)
    const themes = ['day', 'sunset', 'night'];
    const themeLabels = { day: '海滨', sunset: '晚霞', night: '夜骑' };

    btnTheme.addEventListener('click', () => {
      const curIdx = themes.indexOf(currentTheme);
      currentTheme = themes[(curIdx + 1) % themes.length];
      document.body.setAttribute('data-theme', currentTheme);
      themeLabel.textContent = themeLabels[currentTheme];

      // Night headlight toggle
      const cone = document.getElementById('headlight-cone');
      if (currentTheme === 'night') {
        cone.setAttribute('opacity', '1');
      } else if (currentTheme === 'sunset') {
        cone.setAttribute('opacity', '0.6');
      } else {
        cone.setAttribute('opacity', '0');
      }
    });

    // Sound toggle
    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundLabel.textContent = soundEnabled ? '声音' : '静音';
      btnSound.style.opacity = soundEnabled ? '1' : '0.6';
      if (soundEnabled) initAudio();
    });

    // Pause/Resume
    btnPause.addEventListener('click', () => {
      isRunning = !isRunning;
      const pauseIcon = document.getElementById('pause-icon');
      if (isRunning) {
        lastTime = performance.now();
        pauseIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
      } else {
        pauseIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      }
    });

    // Initialize audio on first user gesture
    window.addEventListener('click', () => initAudio(), { once: true });
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.code === 'Space') {
        btnBell.click();
      }
    });

    // Start Animation
    requestAnimationFrame(animate);
  </script>
</body>
</html>
